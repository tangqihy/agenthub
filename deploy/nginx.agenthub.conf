    ssl_certificate     /etc/letsencrypt/live/innee.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innee.cn/privkey.pem;

    root /opt/agenthub-production/current/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
