server {
    listen 443 ssl;
    server_name staging.innee.cn;

    ssl_certificate     /etc/letsencrypt/live/staging.innee.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.innee.cn/privkey.pem;

    root /opt/agenthub-staging/current/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
